datasource:
  type: grafana-postgresql-datasource
  uid: timescaledb

database:
  time_column: time
  value_column: value

dashboard:
  refresh: 10s
  default_from: now-6h
  default_to: now
  editable: true
  schema_version: 39
  tags:
    - BATMACHINE
    - semantic-dashboard

#   Property appears in multiple equipment wrappers.
generic:
  title: "Mathis generic equipment dashboard"

  description: >
    This dashboard plots measurement channels represented by semantic
    properties that can be used across compatible coating and drying
    equipment. Signals are grouped according to their semantic property
    and physical unit.

  properties:
    - coater:hasWinderDiameterData
    - coater:hasWinderTensionData
    - coater:hasFurnaceTemperatureData
    - coater:hasFurnaceFanData

# Property appears only in the current equipment wrapper.
equipment_specific:
  title: "Mathis equipment-specific dashboard"

  description: >
    This dashboard plots semantic properties that are unique to the
    Mathis coating equipment wrapper and are not available in the FOM
    equipment wrapper.

    The displayed signals represent Mathis-specific functionality,
    including IR pyrometer temperature measurements used to monitor
    web temperature within the dryer and fan control setpoints used
    to configure dryer operating conditions. These properties are
    specific to the current equipment configuration and may not be
    available on other coating systems.

  properties:
    - coater:hasIRPyrometerTemperatureData
    - coater:hasFurnaceFanControl
    