_DryerDevice</p>\n        <p><b>Equipment description</b>: Dyer device based on a furnace with Hot Air to heat and dry the coated substrate foil for the production of rolled electrodes.</p>\n        ", "https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer1Device": "<h3>SINTEF Mathis HotAir_Dryer1Device</h3>\n        <p>Status: Online</p>\n        <p><b>ID</b>: https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer1Device</p>\n        <p><b>Equipment description</b>: First furnace in the Dyer device based on a furnace with Hot Air to heat and dry the coated substrate foil for the production of rolled electrodes.</p>\n        ", "https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer1Bottom": "<h3>SINTEF Mathis HotAir_DryerDevice1Bottom</h3>\n        <p>Status: Online</p>\n        <p><b>ID</b>: https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer1Bottom</p>\n        <p><b>Equipment description</b>: Bottom Part of First furnace in the Dyer device based on a furnace with Hot Air to heat and dry the coated substrate foil for the production of rolled electrodes.</p>\n        ", "https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer1Top": "<h3>SINTEF Mathis HotAir_DryerDevice1Top</h3>\n        <p>Status: Online</p>\n        <p><b>ID</b>: https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer1Top</p>\n        <p><b>Equipment description</b>: Top part of First furnace in the Dyer device based on a furnace with Hot Air to heat and dry the coated substrate foil for the production of rolled electrodes.</p>\n        ", "https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer2Device": "<h3>SINTEF Mathis HotAir_Dryer2Device</h3>\n        <p>Status: Online</p>\n        <p><b>ID</b>: https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer2Device</p>\n        <p><b>Equipment description</b>: Second furnace in the Dyer device based on a furnace with Hot Air to heat and dry the coated substrate foil for the production of rolled electrodes.</p>\n        ", "https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer2Bottom": "<h3>SINTEF Mathis HotAir_DryerDevice2Bottom</h3>\n        <p>Status: Online</p>\n        <p><b>ID</b>: https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer2Bottom</p>\n        <p><b>Equipment description</b>: Bottom Part of Second furnace in the Dyer device based on a furnace with Hot Air to heat and dry the coated substrate foil for the production of rolled electrodes.</p>\n        ", "https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer2Top": "<h3>SINTEF Mathis HotAir_DryerDevice2Top</h3>\n        <p>Status: Online</p>\n        <p><b>ID</b>: https://w3id.org/mathis-ind/public/ontology#SINTEF_Mathis_HotAir_Dryer2Top</p>\n        <p><b>Equipment description</b>: Top part of Second furnace in the Dyer device based on a furnace with Hot Air to heat and dry the coated substrate foil for the production of rolled electrodes.</p>\n        "};

function showModal(html) {
  const modal      = document.getElementById("detailModal");
  const modalBody  = document.getElementById("modalBody");
  modalBody.innerHTML = html;
  modal.style.display = "block";
}

function hideModal() {
  document.getElementById("detailModal").style.display = "none";
}

document.getElementById("modalClose").onclick = hideModal;
window.onclick = (event) => {
  const modal = document.getElementById("detailModal");
  if (event.target === modal) hideModal();
};

// Hook into pyvis / Vis.js
// 'network' is the Vis Network instance injected by pyvis
network.on("click", function(params) {
  if (params.nodes.length > 0) {
    const id = params.nodes[0];
    if (nodeDetails[id]) {
      showModal(nodeDetails[id]);
    }
  }
});
</script>
